<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontaktsida</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!--KONTAKT-->
    <section class="contact">
        <h2>Kontakta oss</h2>

        <form>
            <label for="name">Namn</label>
            <input type="text" id="name" placeholder="Ditt namn">

            <label for="email">E-post</label>
            <input type="email" id="email" placeholder="Din@email.se">

            <label for="message">Meddelande</label>
            <textarea id="message" placeholder="Skriv ditt meddelande här.."></textarea>

            <button type="submit">Skicka meddelande</button>
        </form>

    </section>


    <!--FOOTER-->
    <footer>
        <h2>Gröna Oasen</h2>
        <p>Din lokala plantbutik i hjärtat av staden.</p>
        <p>info@gronaoasen.se</p>
        <p>+46 1 234 56 78</p>
        <hr>
        <p>© 2024 Gröna Oasen</p>
    </footer>
</body>

</html>
